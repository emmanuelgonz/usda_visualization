<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>USDA Crop Progress and Condition over the Cropland Data Layer</title>
<link rel="stylesheet" href="/static/vendor/leaflet/leaflet.css">
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<div id="map"></div>

<div id="viewer" hidden>
  <div id="viewerBox" role="dialog" aria-label="EMIT browse image">
    <button id="viewerClose" type="button" title="Close (Esc)">&times;</button>
    <div id="viewerMap"></div>
    <p id="viewerMeta"></p>
    <p class="note">Scroll or pinch to zoom, drag to pan, double-click to zoom in; <a href="#" id="viewerFit">fit to window</a>. The picture has no map coordinates.</p>
  </div>
</div>

<aside id="panel">
  <h1>CPC over CDL</h1>

  <section class="controls">
    <label>Crop
      <select id="crop"></select>
    </label>
    <label>Variable
      <select id="var"></select>
    </label>
    <label>CPC year
      <select id="year"></select>
    </label>
    <label>CDL year
      <select id="cdlYear"></select>
    </label>
  </section>

  <section class="controls">
    <label>Week <output id="weekOut"></output>
      <input type="range" id="week" min="0" max="0" step="1">
    </label>
    <div class="row">
      <button id="play" type="button">Play</button>
      <button id="prev" type="button">&larr;</button>
      <button id="next" type="button">&rarr;</button>
    </div>
  </section>

  <section class="controls">
    <fieldset>
      <legend>View</legend>
      <label class="inline"><input type="radio" name="mode" value="overlay" checked> Overlay</label>
      <label class="inline"><input type="radio" name="mode" value="swipe"> Swipe</label>
    </fieldset>
    <label class="inline"><input type="checkbox" id="cdl" checked> CDL base layer</label>
    <label class="inline"><input type="checkbox" id="mask"> Mask to crop extent</label>
    <div class="inline sub" id="dimRow">Off-crop:
      <label class="inline"><input type="radio" name="dim" value="white" checked> White</label>
      <label class="inline"><input type="radio" name="dim" value="grey"> Grey</label>
    </div>
    <label class="inline"><input type="checkbox" id="states" checked> State boundaries</label>
    <label>Time window ±days <output id="timeWindowOut">7</output>
      <input type="range" id="timeWindow" min="0" max="30" step="1" value="7">
      <span class="note">Around the selected CPC week's Sunday; drives the EMIT highlight and the HLS week window.</span>
    </label>
    <label class="inline"><input type="checkbox" id="emit"> EMIT footprints</label>
    <div class="sub" id="emitControls">
      <label>Max cloud cover <output id="emitCloudOut">30%</output>
        <input type="range" id="emitCloud" min="0" max="100" step="5" value="30">
      </label>
      <label class="inline"><input type="checkbox" id="emitOnlyWindow"> Only scenes within window</label>
      <label class="inline"><input type="checkbox" id="coincide"> Mark ECOSTRESS coincidence</label>
      <label class="inline"><input type="checkbox" id="coincideAll"> Mark ECOSTRESS + HLS coincidence</label>
      <label>Coincidence window <output id="coincideWindowOut">15 min</output>
        <input type="range" id="coincideWindow" min="0" max="8" step="1" value="2">
      </label>
      <label class="inline"><input type="checkbox" id="coincideOnly"> Only coincident scenes</label>
      <div id="emitLegend"></div>
    </div>
    <label class="inline"><input type="checkbox" id="eco"> ECOSTRESS swaths</label>
    <div class="sub" id="ecoControls">
      <div class="inline">
        <label class="inline"><input type="radio" name="ecoDay" value="DAY" checked> Day</label>
        <label class="inline"><input type="radio" name="ecoDay" value="NIGHT"> Night</label>
        <label class="inline"><input type="radio" name="ecoDay" value="ALL"> Both</label>
      </div>
      <div id="ecoLegend"></div>
    </div>
    <label class="inline"><input type="checkbox" id="hls"> HLS coverage</label>
    <div class="sub" id="hlsControls">
      <div class="inline">Mode:
        <label class="inline"><input type="radio" name="hlsMode" value="week" checked> Week window</label>
        <label class="inline"><input type="radio" name="hlsMode" value="season"> Season</label>
      </div>
      <div class="note" id="hlsRange"></div>
      <label>Max cloud <output id="hlsCloudOut">30%</output>
        <input type="range" id="hlsCloud" min="0" max="100" step="5" value="30">
      </label>
      <div class="inline">Sensor:
        <label class="inline"><input type="radio" name="hlsSensor" value="ALL" checked> Both</label>
        <label class="inline"><input type="radio" name="hlsSensor" value="L30"> L30</label>
        <label class="inline"><input type="radio" name="hlsSensor" value="S30"> S30</label>
      </div>
      <div id="hlsLegend"></div>
    </div>
    <label>CDL opacity <output id="cdlOpacityOut">100%</output>
      <input type="range" id="cdlOpacity" min="0" max="100" step="5" value="100">
    </label>
    <label>CPC opacity <output id="opacityOut">70%</output>
      <input type="range" id="opacity" min="0" max="100" step="5" value="70">
    </label>
  </section>

  <section id="legend"></section>
  <p id="pairing" class="note"></p>
  <p class="note">Click the map to inspect a cell.</p>
</aside>

<script src="/static/vendor/leaflet/leaflet.js"></script>
<script src="/static/app.js"></script>
</body>
</html>
